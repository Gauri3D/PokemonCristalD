<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17132b">
<title>Gauri.3D | Pokémon Cristal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#17132b;color:#fff;font-family:system-ui,-apple-system,sans-serif}#game{width:100%;height:100dvh;min-height:100vh}.welcome{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 25%,#55407d,#17132b 75%);text-align:center}.welcome[hidden]{display:none}.panel{width:min(100%,420px);padding:36px 24px;border:1px solid #ffffff35;border-radius:26px;background:#ffffff12;box-shadow:0 20px 65px #0005}.mark{font-size:40px}h1{margin:8px 0;font-size:clamp(30px,8vw,42px);letter-spacing:-.05em}.subtitle{color:#e6d8f6;margin:8px 0 28px}button{width:100%;padding:16px;border:0;border-radius:14px;background:#e6c4ff;color:#211432;font-size:17px;font-weight:800;cursor:pointer}button:disabled{opacity:.7}.status{min-height:24px;margin:16px 0 0;font-size:13px;color:#e6d8f6}.foot{font-size:12px;color:#d6c1e9;margin:22px 0 0}
</style>
</head>
<body>
<main id="game" aria-label="Emulador Game Boy Color"></main>
<section class="welcome" id="welcome"><div class="panel"><div class="mark" aria-hidden="true">✦</div><h1>GAURI.3D</h1><p class="subtitle">Tu aventura comienza aquí.<br>Pokémon Cristal</p><button type="button" id="start">INICIAR JUEGO</button><p class="status" id="status" role="status" aria-live="polite">Toca para preparar tu aventura.</p><p class="foot">Cartucho NFC · Edición retro</p></div></section>
<script>
const start=document.getElementById('start'),welcome=document.getElementById('welcome'),statusText=document.getElementById('status');let loading=false,timer;
function recover(message){clearTimeout(timer);statusText.textContent=message;start.disabled=false;start.textContent='REINTENTAR';start.onclick=()=>location.reload();}
start.addEventListener('click',()=>{if(loading)return;loading=true;start.disabled=true;start.textContent='PREPARANDO JUEGO…';statusText.textContent='Cargando el emulador…';
window.EJS_player='#game';window.EJS_core='gb';window.EJS_gameName='Pokemon Cristal';window.EJS_color='#0064ff';window.EJS_startOnLoaded=false;window.EJS_AdPhant_MobileGamepad=true;window.EJS_mouse=false;window.EJS_GamepadOpacity='0.7';window.EJS_scaleControls=true;window.EJS_forceLocalSave=true;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_gameUrl='./PokemonCristal.gbc';window.EJS_ready=()=>{clearTimeout(timer);welcome.hidden=true;};
const script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.onerror=()=>recover('No se pudo descargar EmulatorJS. Comprueba tu conexión.');timer=setTimeout(()=>{if(!welcome.hidden)recover('La carga está tardando demasiado. Pulsa REINTENTAR.');},30000);document.body.appendChild(script);
});
</script>
</body>
</html>
